name: OmiBattery
options: { bundleIdPrefix: local.omi, deploymentTarget: { iOS: "17.0" } }
targets:
  OmiBattery:
    type: application
    platform: iOS
    sources: [OmiBattery]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.omi.battery$(DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Reads the Omi pendant battery level."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Omi電池"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
